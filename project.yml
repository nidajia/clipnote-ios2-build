# 片记 ClipNote v2 —— 重做工程（第一包）

# 与旧的 ios/ 完全独立：新 Bundle ID、新目录、不读旧工程任何文件。
# 当前阶段只有一个目标：把「组件 + CI 截图验收」这条链路跑通。

name: ClipNote2

options:
  bundleIdPrefix: com.clipnote
  developmentLanguage: zh-Hans
  deploymentTarget:
    # 16.0 而不是 17.0：装机走 TrollStore（未签名 ipa），而它覆盖到 iOS 16.6.1。
    # 17 专属 API 已全部替换，代价只有几处（navigationDestination(item:) /
    # topBarTrailing / 双参数 onChange / presentationBackground / #Preview）。
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 这里不关签名：模拟器用 ad-hoc 签名即可，显式关掉反而可能让测试包加载失败。
    # 将来要出 device ipa 时，在 xcodebuild 命令行上传 CODE_SIGNING_ALLOWED=NO，
    # 不要写进工程设置。

targets:
  ClipNote2:
    type: application
    platform: iOS
    sources:
      # 显式声明资源：xcodegen 对 .json 的归类靠猜，猜错就会在 CI 上
      # 得到「Bundle.main 里没有 library-sample.json」，而这件事本地看不出来。
      - path: Sources/ClipNote2
        excludes:
          - "Resources/**"
      - path: Sources/ClipNote2/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ClipNote2
        PRODUCT_BUNDLE_IDENTIFIER: com.clipnote.v2
        MARKETING_VERSION: "8.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "片记"
        # 没有这一行，装到手机上就是个空白方块
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # 没有这一句，第一次调 SFSpeechRecognizer 会**直接崩**（不是报错，是闪退），
        # 而且只在那台真机上复现——模拟器上根本走不到这一步。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用系统的本机听写把视频音轨转成文字，以便生成分段。音频不会离开这台设备。"
        # 图文作品的「保存到相册」。缺这一条不是弹不出授权，是**直接闪退**——
        # 和语音权限同一个坑，而且只在真机上复现。用 .addOnly，只写入不读取。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "把图文作品里的图片保存到相册。只写入，不读取你相册里的其它照片。"
        # 后台播放：图文作品的 BGM 在锁屏/切到别的 App 时继续响。
        # 光有这个还不行，还要 AppDelegate 里把 AVAudioSession 设成 .playback，
        # 缺一半就是「能播，但一退到后台就停」。
        INFOPLIST_KEY_UIBackgroundModes: "audio"
        # 这里放开横屏是**必要但不充分**的：真正决定「现在能不能转」的是
        # AppDelegate.supportedInterfaceOrientationsFor，它平时只返回竖屏，
        # 只有全屏播放页在屏幕上时才放开。Info.plist 里不写横屏，
        # requestGeometryUpdate 会直接被系统拒绝——那种失败没有任何报错。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  ClipNote2Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ClipNote2Tests
        excludes:
          - "Fixtures/**"
      # 契约基准：从线上抓下来的真实响应，解码测试的对象
      - path: Tests/ClipNote2Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: ClipNote2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipnote.v2.tests
        GENERATE_INFOPLIST_FILE: YES
        # 显式指定宿主，避免在 CI 上退化成逻辑测试（那样 Bundle.main 取不到 Assets 里的颜色）
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClipNote2.app/ClipNote2"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ClipNote2:
    build:
      targets:
        ClipNote2: all
        ClipNote2Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ClipNote2Tests
