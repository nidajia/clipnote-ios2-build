name: Component Screenshots

# 只做一件事：把组件画廊渲染成 PNG 并上传。
# 这是第一包验收第 6 条的最小实现——先证明「不需要人工装机也能看到界面」。
#
# 注意：旧的 build-ipa.yml 用的是 macos-14，该镜像已于 2026-11-02 退役。
# 这里改用 macos-15 + 它自带的 Xcode，不再硬钉 Xcode 15.4。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -10

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 选一台可用模拟器
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "使用模拟器：$UDID"

      - name: 跑组件快照测试
        run: |
          set -o pipefail
          xcodebuild test \
            -project ClipNote2.xcodeproj \
            -scheme ClipNote2 \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath build/Screenshots.xcresult

      # 组件用 ImageRenderer 就够了；整屏必须真的启动 App，
      # 因为 ImageRenderer 画不出 List / TabView（会变成系统「不可用」占位符）。
      - name: 整屏截图（simctl）
        run: bash Tools/screenshot.sh "$SIM_UDID" build

      - name: 列出产物
        if: always()
        run: ls -la screenshots || echo "screenshots 目录不存在"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-screenshots
          path: |
            screenshots/*.png
            build/Screenshots.xcresult
          if-no-files-found: warn
